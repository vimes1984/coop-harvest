services:
  # Node.js Express REST API Backend
  - type: web
    name: growers-collective-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard (e.g. from MongoDB Atlas Free Cluster)
      - key: STRIPE_SECRET_KEY
        sync: false # Optional
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Optional

  # React static site frontend
  - type: web
    name: growers-collective-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --ignore-scripts && npm run build
    publishDir: dist
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_URL
        fromService:
          name: growers-collective-backend
          type: web
          property: url
